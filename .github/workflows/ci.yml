name: Build and release

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ExcelVbaMcp.slnx

      - name: Build
        run: dotnet build ExcelVbaMcp.slnx --configuration Release --no-restore

      - name: Test solution
        run: dotnet test ExcelVbaMcp.slnx --configuration Release --no-build --no-restore

      - name: Publish win-x64 single-file executable
        run: >-
          dotnet publish src/ExcelVbaMcp.Server/ExcelVbaMcp.Server.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output artifacts/publish

      - name: Assemble plugin package
        shell: pwsh
        run: |
          $pluginRoot = 'artifacts/package/excel-vba-mcp'
          New-Item -ItemType Directory -Path "$pluginRoot/bin/win-x64" -Force | Out-Null
          Copy-Item .claude-plugin $pluginRoot -Recurse
          Copy-Item .codex-plugin $pluginRoot -Recurse
          Copy-Item .mcp.json "$pluginRoot/.mcp.json"
          Copy-Item artifacts/publish/ExcelVbaMcp.exe "$pluginRoot/bin/win-x64/ExcelVbaMcp.exe"

      - name: Smoke-test executable included in plugin package
        run: >-
          dotnet run
          --project tests/ExcelVbaMcp.SmokeTest/ExcelVbaMcp.SmokeTest.csproj
          --configuration Release
          --no-build
          -- artifacts/package/excel-vba-mcp/bin/win-x64/ExcelVbaMcp.exe

      - name: Create and inspect plugin ZIP
        shell: pwsh
        run: |
          $zip = 'artifacts/excel-vba-mcp-plugin-win-x64.zip'
          $extractedRoot = 'artifacts/extracted/excel-vba-mcp'
          Compress-Archive -Path artifacts/package/excel-vba-mcp -DestinationPath $zip
          Expand-Archive -Path $zip -DestinationPath artifacts/extracted

          $requiredPaths = @(
            "$extractedRoot/.claude-plugin/plugin.json"
            "$extractedRoot/.codex-plugin/plugin.json"
            "$extractedRoot/.mcp.json"
            "$extractedRoot/bin/win-x64/ExcelVbaMcp.exe"
          )
          foreach ($requiredPath in $requiredPaths) {
            if (-not (Test-Path -LiteralPath $requiredPath -PathType Leaf)) {
              throw "Plugin ZIP is missing required file: $requiredPath"
            }
          }

      - name: Smoke-test executable extracted from plugin ZIP
        run: >-
          dotnet run
          --project tests/ExcelVbaMcp.SmokeTest/ExcelVbaMcp.SmokeTest.csproj
          --configuration Release
          --no-build
          -- artifacts/extracted/excel-vba-mcp/bin/win-x64/ExcelVbaMcp.exe

      - name: Upload packaged plugin
        uses: actions/upload-artifact@v7
        with:
          name: excel-vba-mcp-plugin-win-x64
          path: artifacts/excel-vba-mcp-plugin-win-x64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged plugin
        uses: actions/download-artifact@v8
        with:
          name: excel-vba-mcp-plugin-win-x64
          path: artifacts

      - name: Create or update tagged GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --verify-tag --generate-notes --title $tag
          }
          gh release upload $tag artifacts/excel-vba-mcp-plugin-win-x64.zip --clobber
